project:
  type: book
  output-dir: _book

execute:
  freeze: auto
  warning: false
  message: false
  error: true

book:
  title: "Environmental Computing"
  reader-mode: true

  page-footer:
    left: |
      Environmental Computing was written by XXX
    right: |
      This book was built with <a href="https://quarto.org/">Quarto</a>.
  cover-image: images/hexsticker_EC.png
  favicon: images/hexsticker_EC.png 
  site-url: http://environmentalcomputing.net/
  repo-url: https://github.com/nicercode/EnvironmentalComputing
  repo-branch: master
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - content/preface.qmd
    - part: content/big-picture/big-picture.qmd
