project:
  type: book
  output-dir: _book
  # placeholder chapters (see "planned" below) are not rendered. To publish
  # one, delete its "!" line here AND uncomment it under book: chapters
  render:
    - "*.qmd"
    - "content/**/*.qmd"
    - "!content/big-picture/"
    - "!content/essential-maths/"
    - "!content/dynamic-systems/"
    - "!content/basics/python.qmd"
    - "!content/basics/data/"
    - "!content/data-literacy/data-literacy.qmd"
    - "!content/data-literacy/tidy-data-principles.qmd"
    - "!content/data-literacy/data-principles.qmd"
    - "!content/data-literacy/access.qmd"
    - "!content/data-literacy/metadata.qmd"
    - "!content/data-literacy/data-types.qmd"
    - "!content/data-literacy/tables.qmd"
    - "!content/data-literacy/data-frames.qmd"
    - "!content/data-literacy/csv.qmd"
    - "!content/data-literacy/excel.qmd"
    - "!content/data-literacy/time-series.qmd"
    - "!content/data-literacy/relational.qmd"
    - "!content/data-literacy/sequence.qmd"
    - "!content/data-literacy/databases.qmd"
    - "!content/data-literacy/photos.qmd"
    - "!content/data-literacy/audio.qmd"
    - "!content/data-literacy/remotesensing.qmd"
    - "!content/data-literacy/arrange/"
    - "!content/data-literacy/select-columns/"
    - "!content/data-literacy/group_by/"
    - "!content/data-visualisation/plotting-frameworks.qmd"
    - "!content/data-visualisation/choosing-the-right-plot.qmd"
    - "!content/statistical-methods/confidence-intervals.qmd"
    - "!content/statistical-methods/multi-variate-models.qmd"
    - "!content/statistical-methods/machine-learning.qmd"
    - "!content/statistical-methods/supervised-learning.qmd"
    - "!content/statistical-methods/random-forests.qmd"
    - "!content/statistical-methods/support-vector-machines.qmd"
    - "!content/statistical-methods/neural-networks.qmd"
    - "!content/statistical-methods/unsupervised-learning.qmd"
    - "!content/statistical-methods/bayesian-inference.qmd"
    - "!content/statistical-methods/Markov-Chain-Monte-Carlo.qmd"
    - "!content/coding-skills/pipes.qmd"
    - "!README.qmd"
  # data downloads keep their old addresses (/datasets/...), and old page
  # addresses redirect to the book (Netlify _redirects, generated by
  # migration/migrate.py)
  resources:
    - datasets/
    - _redirects

execute:
  freeze: auto
  warning: false
  message: false
  error: true

book:
  title: "Environmental Computing"
  reader-mode: true
  sidebar:
    collapse-level: 1

  page-footer:
    left: |
      Environmental Computing is written by [its editors, authors and contributors](/content/preface.html).
    right: |
      This book was built with <a href="https://quarto.org/">Quarto</a>.
  cover-image: images/hexsticker_EC.png
  cover-image-alt: "Environmental Computing hex sticker"
  favicon: images/hexsticker_EC.png 
  site-url: https://environmentalcomputing.net/
  repo-url: https://github.com/nicercode/EnvironmentalComputing
  repo-branch: master
  repo-actions: [edit, issue]
  # Chapters marked "planned" are placeholders, left out until written.
  # To publish one, uncomment its line (and add the part back if needed) AND
  # delete its "!" exclusion under project: render, or it is listed but
  # never built.
  chapters:
    - href: index.qmd
      text: Welcome
    - content/preface.qmd

