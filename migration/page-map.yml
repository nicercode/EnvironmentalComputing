        coverage_exceptions:
          - starts: "The paired *t*-test is run with the `t.test` function"
            reason: R 4.4 no longer accepts paired = TRUE with a formula (see edits)
          - starts: "t.test(Performance ~ Treatment, data = Greenhouse, paired = TRUE)"
            reason: R 4.4 no longer accepts paired = TRUE with a formula (see edits)
    edits:
      - reason: since R 4.4, t.test() no longer accepts paired = TRUE with a formula
        old: "The paired *t*-test is run with the `t.test` function, with the arguments specifying the response variable (Performance) to the left of the ~, the predictor variable (Treatment) to the right of the ~, the data frame to be used and the fact that it is a paired *t*-test."
        new: "For the paired *t*-test, the two measurements from each plant need to be side by side, so we first reshape the data to have one row per plant and a column for each treatment (see [reshaping data](../data-literacy/pivotting/index.qmd)). The `t.test` function is then given the two columns and told that they are paired. (Older versions of R also allowed `t.test(Performance ~ Treatment, data = Greenhouse, paired = TRUE)`; since R 4.4 this is an error.)"
      - reason: since R 4.4, t.test() no longer accepts paired = TRUE with a formula
        all: true
        old: "t.test(Performance ~ Treatment, data = Greenhouse, paired = TRUE)"
        new: "Greenhouse_wide <- tidyr::pivot_wider(Greenhouse, id_cols = Plant,\n  names_from = Treatment, values_from = Performance\n)\nt.test(Greenhouse_wide$Sunny, Greenhouse_wide$Shady, paired = TRUE)"
