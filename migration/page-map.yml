# Mapping from every page of the old Hugo/blogdown site to its chapter in
# the Quarto book. Used by migration/migrate.py, which refuses to run if any
# old page is missing from this file or listed twice.
#
# chapter:  path of the .qmd under content/ (or the project root)
# sources:  old pages (folder under content/ on the Hugo site), in order
#   section: heading (##) to place that page under when several pages are
#            merged into one chapter; omit to continue the previous section
#            (or, for the first source, to form the chapter's introduction)
# edits:    exact find/replace fixes applied after merging, each with a
#           reason; the script stops if the text to replace isn't found.
#           `all: true` replaces every occurrence (default: the first)
# prefer:   "old" uses the old page's wording wherever the first conversion
#           reworded it (default: keep the first conversion's wording unless
#           it dropped text)
# seed:     random number seed set by a hidden chunk at the top of the
#           chapter, for chapters whose code draws random numbers, so a
#           re-run gives the same output and the same frozen figures

source_ref: 7b59e6f   # old site incl. PRs #44, #45 and the multipanel tutorial (merged to master in #45)
branch_ref: a31b08e   # first Quarto conversion (refactor_quarto), merged with the above
base_ref: 3950af0     # the old site as it was when that conversion was made; text
                      # changed on the old site since then wins over the conversion

# Replacements for dead external links, applied to every chapter (checked
# 2026-10-16). Each must match somewhere, or migrate.py stops.
link_fixes:
  - reason: ape's site moved
    old: "[ape](http://ape-package.ird.fr/)"
    new: "[ape](https://emmanuelparadis.github.io/)"
  - reason: glmmADMB is no longer maintained; glmmTMB is its successor
    old: "try the [glmmADMB](http://glmmadmb.r-forge.r-project.org/) package."
    new: "try the [glmmTMB](https://glmmtmb.github.io/glmmTMB/) package, which can fit negative binomial and other models for overdispersed data with random effects (it replaces the older glmmADMB package)."
  - reason: the draft chapter is gone; the published paper by lme4's authors replaces it
    all: true
    old: "[Draft book chapter](http://lme4.r-forge.r-project.org/book/Ch2.pdf) from the authors of lme4."
    new: "[Fitting linear mixed-effects models using lme4](https://doi.org/10.18637/jss.v067.i01) (Bates et al. 2015, *Journal of Statistical Software*), from the authors of lme4."
  - reason: dead link; reshape2 is superseded by tidyr's pivot functions
    old: "[An introduction to reshape2](http://seananderson.ca/2013/10/19/reshape.html)"
    new: "[Pivoting](https://tidyr.tidyverse.org/articles/pivot.html), tidyr's guide to `pivot_longer()` and `pivot_wider()`, which replace `gather()`/`spread()` and reshape2's `melt()`/`dcast()`"
  - reason: Quick-R page gone
    old: "and [here](http://www.statmethods.net/input/datatypes.html)"
    new: "and in the [Vectors chapter](https://adv-r.hadley.nz/vectors-chap.html) of *Advanced R*"
  - reason: colour chart PDF gone
    all: true
    old: "http://www.stat.columbia.edu/~tzheng/files/Rcolor.pdf"
    new: "https://r-graph-gallery.com/42-colors-names.html"
  - reason: Stack Overflow renamed the page
    old: "https://stackoverflow.com/help/mcve"
    new: "https://stackoverflow.com/help/minimal-reproducible-example"

