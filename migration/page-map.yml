    edits:
      - reason: metafor's example datasets moved to the metadat package
        old: 'Have a look at the data set named `dat.curtis1998` included in the package. If you have to see the other data sets included in this package, try `help(package="metafor")`.'
        new: 'Have a look at the data set named `dat.curtis1998`, from the metadat package that comes with metafor. To see the other data sets included in that package, try `help(package="metadat")`.'
      - reason: metafor's example datasets moved to the metadat package
        old: "dat <- metafor::dat.curtis1998"
        new: "dat <- metadat::dat.curtis1998"
      - reason: metafor's example datasets moved to the metadat package
        all: true
        old: "dat <- get(data(dat.curtis1998))"
        new: "dat <- metadat::dat.curtis1998"

