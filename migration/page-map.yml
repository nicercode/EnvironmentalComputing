        old: "[Simple Maps](#simple-maps) section below"
        new: "[Simple maps](simple-maps.qmd) chapter"
      - reason: rgdal was retired from CRAN in 2023; raster now reads files through terra
        old: ", and rgdal has a lot of the drivers for reading and writing various spatial data formats"
        new: ". (Older versions of this tutorial also used rgdal for reading spatial file formats; it was retired from CRAN in 2023, and raster now does this itself through the terra package.)"
      - reason: rgdal was retired from CRAN in 2023
        old: 'install.packages(c("raster", "dismo", "rgdal"))'
        new: 'install.packages(c("raster", "dismo"))'
      - reason: rgdal was retired from CRAN in 2023
        old: "library(dismo)\nlibrary(rgdal)\n"
        new: "library(dismo)\n"
      - reason: reading .img files through terra names layers "Layer_1", not after the file, so name them explicitly
        all: true
        old: 'names(sst_stack)[3] <- "SST_anomaly"'
        new: 'names(sst_stack) <- c("SST_feb_mean", "SST_feb_2013", "SST_anomaly")'
