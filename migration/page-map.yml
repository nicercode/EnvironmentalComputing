        section: Visualising spatial data
  - chapter: data-visualisation/ggplot.qmd
    prefer: old        # restore the original pages in full
    sources:
      - page: Graphics/basic-plotting
      - page: Graphics/basic-plotting/one-continuous
        section: One continuous variable
      - page: Graphics/basic-plotting/two-continuous
        section: Two continuous variables
      - page: Graphics/basic-plotting/one-continuous-one-factor
        section: One continuous and one categorical variable
      - page: Graphics/ggplot
        section: Introduction to ggplot2
      - page: Graphics/ggplot/ggplot-basics
      - page: Graphics/ggplot/ggplot-labels
        section: Titles and axis labels
      - page: Graphics/ggplot/ggplot-colour-shapes
        section: Colours and shapes
      - page: Graphics/ggplot/ggplot-barplot
        section: Bar plots with error bars
      - page: Graphics/ggplot/ggplot-appearance
        section: Customising your ggplot
    edits:
      - reason: link target split over two lines on the old page
        old: "See [here](/data-manipulation/summarising-data/\n)"
        new: "See [here](../data-literacy/summarising-tables/index.qmd)"
  - chapter: data-visualisation/multi-panel-figures.qmd
    replaces: data-visualisation/mutli-panel-figures.qmd
    title: Multipanel figures with ggplot2
    sources:
      - page: Graphics/ggplot/ggplot-multipanel
  - chapter: data-visualisation/rasters.qmd
    sources:
      - page: Graphics/spatial-vis/basic-raster
        coverage_exceptions:
          - starts: "Install the packages we're going to need"
            reason: rgdal (retired from CRAN in 2023) no longer needed
          - starts: "install.packages(c(\"raster\", \"dismo\", \"rgdal\"))"
            reason: rgdal (retired from CRAN in 2023) no longer needed
          - starts: "names(sst_stack)[3]"
            reason: layer names now set explicitly (see edits)
    edits:
      - reason: Simple maps is its own chapter, not a section of this one
        old: "[Simple Maps](#simple-maps) section below"
        new: "[Simple maps](simple-maps.qmd) chapter"
      - reason: rgdal was retired from CRAN in 2023; raster now reads files through terra
        old: ", and rgdal has a lot of the drivers for reading and writing various spatial data formats"
        new: ". (Older versions of this tutorial also used rgdal for reading spatial file formats; it was retired from CRAN in 2023, and raster now does this itself through the terra package.)"
      - reason: rgdal was retired from CRAN in 2023
        old: 'install.packages(c("raster", "dismo", "rgdal"))'
        new: 'install.packages(c("raster", "dismo"))'
      - reason: rgdal was retired from CRAN in 2023
        old: "library(dismo)\nlibrary(rgdal)\n"
        new: "library(dismo)\n"
      - reason: reading .img files through terra names layers "Layer_1", not after the file, so name them explicitly
        all: true
        old: 'names(sst_stack)[3] <- "SST_anomaly"'
        new: 'names(sst_stack) <- c("SST_feb_mean", "SST_feb_2013", "SST_anomaly")'
  - chapter: data-visualisation/simple-maps.qmd
    sources:
