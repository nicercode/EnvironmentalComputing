# ARCHIVED: the migration finished in October 2026 and the chapters are now
# edited directly. This file is no longer updated; see migration/README.md.
#
# Mapping from every page of the old Hugo/blogdown site to its chapter in
# the Quarto book. Used by migration/migrate.py, which refuses to run if any
# old page is missing from this file or listed twice.
#
# chapter:  path of the .qmd under content/ (or the project root)
# sources:  old pages (folder under content/ on the Hugo site), in order
#   section: heading (##) to place that page under when several pages are
#            merged into one chapter; omit to continue the previous section
#            (or, for the first source, to form the chapter's introduction)
# edits:    exact find/replace fixes applied after merging, each with a
#           reason; the script stops if the text to replace isn't found.
#           `all: true` replaces every occurrence (default: the first)
# prefer:   "old" uses the old page's wording wherever the first conversion
#           reworded it (default: keep the first conversion's wording unless
#           it dropped text)
# unnumbered: true  show the chapter in the contents without a number
#           (the title becomes an unnumbered level-1 heading)
# seed:     random number seed set by a hidden chunk at the top of the
#           chapter, for chapters whose code draws random numbers, so a
#           re-run gives the same output and the same frozen figures

source_ref: 7b59e6f   # old site incl. PRs #44, #45 and the multipanel tutorial (merged to master in #45)
branch_ref: a31b08e   # first Quarto conversion (refactor_quarto), merged with the above
base_ref: 3950af0     # the old site as it was when that conversion was made; text
                      # changed on the old site since then wins over the conversion

